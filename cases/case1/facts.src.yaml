# Authored fact layer for case1 (input to pipeline/build_facts.py).
#
# Every source unit (paragraph / table cell / chart point in raw/slides.json) automatically
# becomes a `unit` fact (kind=statement). This file adds finer facts that point INTO a unit:
#   in:   unit id (see pipeline/factlib.py for the id scheme)
#   raw:  exact substring of that unit's text (occ: n picks the n-th occurrence, default 0)
#   kind: exact | bound | not_detected | qualitative | missing | statement | date
#   attrs: analyte / method / specimen / site / tracer / gene ... (compatibility keys)
#   implied_unit: unit that is not inside `raw` but stated in the same unit text (basis required)
#   date: a date fact id, or inline {value, basis: from_image|inferred, note}
#   review: {proposed: {...}, issue: "...", basis: "..."}  -> status starts as unreviewed
# Facts that come from inside a picture use  img: {slide, shape, file}  instead of `in`,
# and facts with no source at all use  origin: inferred  (both always need human review).

excluded_units:
  - {match: "u.2.", reason: 目录页}
  - {match: "u.3.", reason: 目录页}
  - {match: "u.22.", reason: 目录页}
  - {match: "u.30.", reason: 目录页}
  - {match: "u.28.9[1-7].p0", reason: 泳道图坐标轴刻度（叠加在原图上，原图已包含）}
  - {match: "u.32.3.p0", reason: 结束页致谢}

